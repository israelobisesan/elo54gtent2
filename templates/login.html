<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Test Publishing Sandbox</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger-bg: rgba(239, 68, 68, 0.15);
            --danger-text: #fca5a5;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
        }
        .badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #60a5fa;
            background: rgba(59, 130, 246, 0.15);
            padding: 0.25rem 0.65rem;
            border-radius: 999px;
            margin-bottom: 0.75rem;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.35rem;
        }
        p.subtitle {
            color: var(--muted);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }
        .error-alert {
            background: var(--danger-bg);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: var(--danger-text);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-bottom: 1.25rem;
        }
        .form-group {
            margin-bottom: 1.15rem;
        }
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: #cbd5e1;
            margin-bottom: 0.4rem;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 0.7rem 0.9rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #0f172a;
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.15s ease;
        }
        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: var(--primary);
        }
        button#login-btn {
            width: 100%;
            margin-top: 0.5rem;
            padding: 0.75rem 1rem;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: white;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease;
        }
        button#login-btn:hover {
            background: var(--primary-hover);
        }
        .hint {
            margin-top: 1.25rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
            font-size: 0.8rem;
            color: var(--muted);
            text-align: center;
        }
        code {
            color: #e2e8f0;
            background: #0f172a;
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <span class="badge">Local Sandbox</span>
        <h1>Test Publishing Sandbox</h1>
        <p class="subtitle">Sign in to publish and inspect automated news posts.</p>

        {% if error %}
        <div class="error-alert" role="alert">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    required
                    autocomplete="username"
                >
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                    autocomplete="current-password"
                >
            </div>
            <button type="submit" id="login-btn">Sign In</button>
        </form>

        <div class="hint">
            Default credentials: <code>{{ default_user }}</code> / <code>password123</code>
        </div>
    </div>
</body>
</html>
